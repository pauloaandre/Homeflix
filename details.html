<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes - Homeflix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0d;
            --card-bg: #141418;
            --border: rgba(255, 255, 255, 0.06);
            --primary: #e50914;
            --text: #f0f0f0;
            --muted: #8a8a9a;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }

        /* HEADER */
        header { padding: 24px 40px; display: flex; align-items: center; gap: 18px; background: linear-gradient(to bottom, rgba(0, 0, 0, 0.7), transparent); position: sticky; top: 0; z-index: 100; }
        .back-btn { color: var(--text); text-decoration: none; font-size: 22px; font-weight: 700; width: 40px; height: 40px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); display: flex; align-items: center; justify-content: center; transition: background 0.2s, color 0.2s; }
        .back-btn:hover { background: var(--primary); color: white; }
        h1.page-title { font-size: 20px; font-weight: 600; }

        /* HERO */
        .hero { display: flex; gap: 36px; padding: 0 40px 40px; max-width: 1200px; }
        .hero-poster { flex-shrink: 0; width: 180px; border-radius: var(--radius); overflow: hidden; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); }
        .hero-poster img { width: 100%; display: block; }
        .hero-info { flex: 1; display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
        .hero-title { font-size: 32px; font-weight: 800; line-height: 1.2; }
        .hero-meta { color: var(--muted); font-size: 14px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

        .badge { background: rgba(229, 9, 20, 0.15); border: 1px solid rgba(229, 9, 20, 0.4); color: var(--primary); padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge.genre { background: rgba(255, 255, 255, 0.06); border-color: var(--border); color: var(--muted); }
        .hero-sinopse { font-size: 15px; color: #c0c0cc; line-height: 1.7; max-width: 700px; }
        
        /* MODAL DO PLAYER DE VÍDEO */
        #VideoContent { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.95); z-index: 1000; justify-content: center; align-items: center; flex-direction: column; }
        .video-container { width: 85%; max-width: 1050px; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 0 40px rgba(229, 9, 20, 0.5); position: relative; }
        .video-container iframe { width: 100%; height: 100%; border: none; }
        .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 36px; cursor: pointer; z-index: 1001; background: none; border: none; }
        .close-btn:hover { color: var(--primary); }

        /* PLAY BUTTON */
        .play-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--primary); color: white; padding: 12px 28px; border-radius: 8px; font-size: 15px; font-weight: 700; text-decoration: none; border: none; cursor: pointer; transition: opacity 0.2s, transform 0.2s; margin-top: 4px; width: fit-content; }
        .play-btn:hover { opacity: 0.85; transform: scale(1.02); }
        .play-btn svg { width: 18px; height: 18px; fill: white; }

        /* SEÇÃO DE TEMPORADAS E EPISÓDIOS */
        .section { max-width: 1200px; padding: 0 40px 60px; }
        .section-title { font-size: 20px; font-weight: 700; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
        .season-tabs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .season-tab { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .season-tab:hover, .season-tab.active { background: var(--primary); border-color: var(--primary); color: white; }

        .episode-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .episode-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); display: flex; gap: 16px; padding: 12px; cursor: pointer; transition: all 0.2s; }
        .episode-card:hover { border-color: var(--primary); background: rgba(229, 9, 20, 0.05); }
        .ep-thumb {
            flex-shrink: 0;
            width: 140px;
            aspect-ratio: 16/9;
            background: #1e1e24;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .ep-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .ep-number { position: absolute; bottom: 5px; left: 5px; background: rgba(0,0,0,0.8); color: white; padding: 2px 6px; font-size: 11px; border-radius: 4px; }
        .ep-info { display: flex; flex-direction: column; gap: 4px; }
        .ep-title { font-weight: 600; font-size: 15px; }
        .ep-sinopse { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

        /* ESTADOS DE CARREGAMENTO */
        .state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; gap: 20px; color: var(--muted); text-align: center; }
        .spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(255, 255, 255, 0.1); border-left-color: var(--primary); animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .state-error { color: var(--primary); }
    </style>
</head>

<body>
    <header>
        <a href="/" class="back-btn">&#8592;</a>
        <h1 class="page-title" id="page-title">Carregando...</h1>
    </header>

    <!-- Modal do Player de Vídeo -->
    <div id="VideoContent">
        <button class="close-btn" onclick="fecharPlayer()">&times;</button>
        <div class="video-container" id="iframe-holder"></div>
    </div>

    <div id="main-content">
        <div class="state-box">
            <div class="spinner"></div>
            <p>Buscando informações...</p>
        </div>
    </div>

    <script>
        const API_BASE = "/api";
        const params = new URLSearchParams(window.location.search);
        const tipo = params.get('tipo');
        const id = params.get('id') || params.get('tmdb_id');

        async function loadDetails() {
            if (!tipo || !id) return;
            try {
                const resp = await fetch(`${API_BASE}/details/${tipo}/${id}`);
                const data = await resp.json();
                if (!resp.ok) throw new Error(data.detail);

                document.getElementById('page-title').textContent = data.titulo;
                
                const isFilme = data.tipo === 'filme';
                const playButton = isFilme ? `<button onclick="abrirPlayer('filme', '${id}')" class="play-btn">Assistir Agora</button>` : '';
                
                let temporadasHTML = '';
                if (!isFilme && data.temporadas) {
                    temporadasHTML = `
                        <div class="section">
                            <h2 class="section-title">Temporadas</h2>
                            <div class="season-tabs">
                                ${data.temporadas.map(s => `<button class="season-tab" onclick="loadSeason('${id}', ${s.temporada}, this)">Temp ${s.temporada}</button>`).join('')}
                            </div>
                            <div id="episode-list" class="episode-list"></div>
                        </div>`;
                }

                document.getElementById('main-content').innerHTML = `
                    <div class="hero">
                        <div class="hero-poster"><img src="${data.imagem}" alt="${data.titulo}"></div>
                        <div class="hero-info">
                            <div class="hero-title">${data.titulo}</div>
                            <div class="hero-meta">${data.nota ? `<span>⭐ ${data.nota.toFixed(1)}</span>` : ''}</div>
                            ${playButton}
                            <p class="hero-sinopse">${data.sinopse}</p>
                        </div>
                    </div>
                    ${temporadasHTML}
                `;
            } catch (err) { document.getElementById('main-content').innerHTML = `<div class="state-box state-error">Erro: ${err.message}</div>`; }
        }

        async function loadSeason(serieId, seasonNum, btn) {
            document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            const list = document.getElementById('episode-list');
            list.innerHTML = `<div class="state-box">Carregando episódios...</div>`;

            try {
                const resp = await fetch(`${API_BASE}/details/serie/${serieId}/season/${seasonNum}`);
                const data = await resp.json();
                list.innerHTML = data.map(ep => `
                    <div class="episode-card" onclick="abrirPlayer('serie', '${serieId}', ${seasonNum}, ${ep.numero})">
                        <div class="ep-thumb"><img src="${ep.imagem}" alt="${ep.titulo}" loading="lazy"></div>
                        <div class="ep-info">
                            <div class="ep-title">${ep.numero} - ${ep.titulo}</div>
                            <div class="ep-sinopse">${ep.sinopse || 'Sem sinopse'}</div>
                        </div>
                    </div>
                `).join('');
            } catch (err) { list.innerHTML = `<div class="state-box state-error">Erro ao carregar.</div>`; }
        }

        async function abrirPlayer(tipoMedia, tmdbId, season = 1, episode = 1) {
            if (!tmdbId || tmdbId === "null" || tmdbId === "undefined") {
                console.error("ID inválido detectado:", tmdbId);
                alert("Erro: Conteúdo indisponível.");
                return;
            }

            try {
                const tipoNormalizado = (tipoMedia === 'movie' || tipoMedia === 'filme') ? 'filme' : 'serie';
                let endpoint = `${API_BASE}/stream/${tipoNormalizado}/${tmdbId}`;
                if (tipoNormalizado === 'serie') endpoint += `?s=${season}&e=${episode}`;

                const response = await fetch(endpoint);
                const data = await response.json();

                if (data.iframe) {
                    document.getElementById("iframe-holder").innerHTML = data.iframe;
                    document.getElementById("VideoContent").style.display = "flex";

                    // Envia para o histórico
                    // Buscamos título e capa da página atual para salvar
                    const titulo = document.querySelector('.hero-title')?.textContent || "Conteúdo";
                    const capa = document.querySelector('.hero-poster img')?.src || '';

                    await fetch(`${API_BASE}/history`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            tmdb_id: tmdbId,
                            titulo: titulo,
                            tipo: tipoNormalizado,
                            capa: capa,
                            temporada: tipoNormalizado === 'serie' ? season : null,
                            episodio: tipoNormalizado === 'serie' ? episode : null,
                            position: 0,
                            duration: 100,
                            updatedAt: Date.now() / 1000
                        })
                    });
                }
            } catch (error) { 
                console.error(error);
                alert("Erro ao abrir player."); 
            }
        }

        function fecharPlayer() {
            document.getElementById("VideoContent").style.display = "none";
            document.getElementById("iframe-holder").innerHTML = ""; 
        }

        document.addEventListener("DOMContentLoaded", loadDetails);
    </script>
</body>
</html>
